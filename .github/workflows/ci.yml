name: FLIGALIGA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server JavaScript
        run: node --check server.js
      - name: Check browser JavaScript
        run: node --check public/script.js
      - name: Check theme initializer
        run: node --check public/theme-init.js
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json OK')"
