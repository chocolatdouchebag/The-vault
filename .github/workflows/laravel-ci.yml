name: Laravel shared-hosting tests

on:
  push:
    branches: [feature/laravel-shared-hosting]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-tests:
    name: Laravel tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check existing storefront JavaScript syntax
        run: node --check public/script.js
      - name: Run Laravel tests
        run: php artisan test

  database-compatibility:
    name: Database schema (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
          - name: MariaDB 10.11
            image: mariadb:10.11
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fligaliga
          MYSQL_USER: fligaliga
          MYSQL_PASSWORD: fligaliga
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run migrations and tests against target database engines
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fligaliga
          DB_USERNAME: fligaliga
          DB_PASSWORD: fligaliga
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate:fresh --force
          php artisan test
