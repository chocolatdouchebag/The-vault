name: Laravel shared-hosting tests

on:
  push:
    branches: [feature/laravel-shared-hosting]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-tests:
    name: Laravel tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Export resolved Composer lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: laravel-composer-lock
          path: composer.lock
          if-no-files-found: error
      - name: Check PHP syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check existing storefront JavaScript syntax
        run: node --check public/script.js
      - name: Run Laravel tests
        run: vendor/bin/phpunit --display-warnings

  database-compatibility:
    name: Database schema (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
          - name: MariaDB 10.11
            image: mariadb:10.11
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fligaliga
          MYSQL_USER: fligaliga
          MYSQL_PASSWORD: fligaliga
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: transfer_user
          POSTGRES_PASSWORD: transfer-test-password
          POSTGRES_DB: laravel_source_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U transfer_user -d laravel_source_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies for transfer validation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check transfer utility syntax
        run: |
          node --check scripts/migrate-postgres-to-laravel-mysql.js
          node --check .github/laravel-postgres-mysql-transfer-test.js
      - name: Install database client utilities
        run: sudo apt-get update && sudo apt-get install -y mysql-client postgresql-client
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run migrations and tests against target database engines
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fligaliga
          DB_USERNAME: fligaliga
          DB_PASSWORD: fligaliga
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate:fresh --force
          vendor/bin/phpunit --display-warnings
      - name: Create disposable database for the transfer test
        env:
          MYSQL_PWD: root
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -e "CREATE DATABASE fligaliga_transfer_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql --protocol=tcp -h 127.0.0.1 -uroot -e "GRANT ALL PRIVILEGES ON fligaliga_transfer_test.* TO 'fligaliga'@'%'"
      - name: Migrate the disposable Laravel target database
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fligaliga_transfer_test
          DB_USERNAME: fligaliga
          DB_PASSWORD: fligaliga
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --force
      - name: Load synthetic PostgreSQL source fixture
        env:
          PGPASSWORD: transfer-test-password
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U transfer_user -d laravel_source_test -f .github/fixtures/postgres-transfer-source.sql
      - name: Transfer synthetic data to the disposable Laravel database
        env:
          PG_SOURCE_HOST: 127.0.0.1
          PG_SOURCE_PORT: 5432
          PG_SOURCE_DATABASE: laravel_source_test
          PG_SOURCE_USER: transfer_user
          PG_SOURCE_PASSWORD: transfer-test-password
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fligaliga_transfer_test
          DB_USERNAME: fligaliga
          DB_PASSWORD: fligaliga
          LARAVEL_MIGRATION_CONFIRM: TRANSFER_DATA_TO_EMPTY_LARAVEL_DATABASE
          # Diagnostic trace is enabled only for this synthetic disposable fixture.
          MYSQL_MIGRATION_DEBUG_ERRORS: "true"
        run: npm run db:migrate-postgres-to-laravel-mysql
      - name: Verify transferred values and Laravel schema fidelity
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fligaliga_transfer_test
          DB_USERNAME: fligaliga
          DB_PASSWORD: fligaliga
        run: node .github/laravel-postgres-mysql-transfer-test.js
